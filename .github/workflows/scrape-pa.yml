name: Scrape Pennsylvania own-games

on:
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: "internal - set automatically by the auto-retry step below, don't set by hand"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Pennsylvania own-games scraper
        id: scrape
        continue-on-error: true
        run: python3 scripts/pa_scraper.py
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "Update Pennsylvania own-games data $(date -u +%Y-%m-%d)"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::git push failed after $max_retries retries (push race with another workflow)"
              exit 1
            fi
            wait_seconds=$(( (RANDOM % 241) + 60 ))
            echo "git push rejected (likely a race with another workflow) - retry ${attempt}/${max_retries} in ${wait_seconds}s"
            sleep "$wait_seconds"
            git pull --rebase origin main
          done
      - name: Purge jsDelivr cache
        if: always()
        run: |
          REPO="${{ github.repository }}"
          for p in cash5 match6 treasure-hunt pick2 pick3 pick4 pick5; do
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/data/pennsylvania/${p}/latest.json"
          done
      - name: Auto-retry once on a fresh runner if the scraper failed
        # lottery.net's own WAF/Cloudflare occasionally blocks the specific ephemeral IP a GH
        # Actions runner happens to get - confirmed 2026-10-24 via real failed-run logs showing the
        # very FIRST request of the run (not just later ones) already timing out at the TCP connect
        # stage, meaning the IP was bad before the scraper made any request at all. Retrying the
        # command in-place (e.g. a step-level retry action) would just hit the same bad IP again -
        # only a brand new job (a brand new runner = a brand new IP) actually has a chance of
        # recovering, which is exactly what manually clicking "re-run" was already doing by hand.
        # Capped at exactly one automatic retry via `retry_attempt` to avoid a failure storm.
        if: steps.scrape.outcome == 'failure' && github.event.inputs.retry_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape-pa.yml -f retry_attempt=1
      - name: Fail job if scraper reported errors
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::scraper reported 1+ game failures this run (see 'Run Pennsylvania own-games scraper' step log) - any games that DID succeed were still committed above"
          exit 1
