name: Scrape Powerball

on:
  # GitHub's own `schedule:` cron was unreliable on this account (the daily
  # schedule job fired 6.5h late), so triggering moved to an external caller
  # (Google Apps Script time-driven trigger) hitting the workflow_dispatch
  # API on a tight interval instead. Keep this file schedule-free.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # 这个 workflow 专属(2026-11-06):powerball.com 对 requests 这类非
      # 浏览器请求有间歇性反爬拦截(同一个 URL，实测成功率只有 50%-75%，
      # 被拦时拿到的是固定大小的假页面，不是连接被拒绝)，改用真实
      # Chromium 内核的 Playwright 抓取，实测同等条件下连续多次全部成功。
      # 只给这一个 workflow 装浏览器二进制——其他彩种的 workflow 不受影响，
      # 也不需要这个体积不小的下载。
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run Powerball scraper
        id: scrape
        continue-on-error: true
        run: python3 scripts/powerball_scraper.py
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "Update Powerball data $(date -u +%Y-%m-%d)"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::git push failed after $max_retries retries (push race with another workflow)"
              exit 1
            fi
            # Another workflow likely pushed to main between our checkout and
            # our push (several scrapers share the same offsetsMinutes in
            # Scheduler.gs and can fire in the same minute) — wait a random
            # 1-5 minutes so two racing retries don't immediately collide
            # again, then rebase onto whatever landed and retry.
            wait_seconds=$(( (RANDOM % 241) + 60 ))
            echo "git push rejected (likely a race with another workflow) - retry ${attempt}/${max_retries} in ${wait_seconds}s"
            sleep "$wait_seconds"
            git pull --rebase -X ours origin main
          done
      - name: Purge jsDelivr cache
        if: always()
        run: |
          REPO="${{ github.repository }}"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/data/multistate/powerball/latest.json"
      - name: Fail job if scraper reported errors
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::scraper reported 1+ game failures this run (see 'Run Powerball scraper' step log) - any games that DID succeed were still committed above"
          exit 1
