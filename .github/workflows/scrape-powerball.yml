name: Scrape Powerball

on:
  # GitHub's own `schedule:` cron was unreliable on this account (the daily
  # schedule job fired 6.5h late), so triggering moved to an external caller
  # (Google Apps Script time-driven trigger) hitting the workflow_dispatch
  # API on a tight interval instead. Keep this file schedule-free.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Powerball scraper
        run: python3 scripts/powerball_scraper.py
      - name: Run Powerball Double Play scraper
        run: python3 scripts/powerball_double_play_scraper.py
      - name: Commit and push if changed
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "没有变化，跳过提交" || git commit -m "Update Powerball data $(date -u +%Y-%m-%d)"
          git push
      - name: Purge jsDelivr cache
        run: |
          REPO="${{ github.repository }}"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/data/multistate/powerball/latest.json"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/data/multistate/powerball-double-play/latest.json"
