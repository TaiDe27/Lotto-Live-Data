name: Scrape Arizona The Pick

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run The Pick scraper
        run: python3 scripts/az_the_pick_scraper.py
      - name: Commit and push if changed
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "没有变化，跳过提交" || git commit -m "Update Arizona The Pick data $(date -u +%Y-%m-%d)"
          git push
      - name: Purge jsDelivr cache
        run: |
          REPO="${{ github.repository }}"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/data/arizona/the-pick/latest.json"
