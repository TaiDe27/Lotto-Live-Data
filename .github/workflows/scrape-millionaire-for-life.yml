name: Scrape Millionaire for Life

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Millionaire for Life scraper
        run: python3 scripts/millionaire_for_life_scraper.py
      - name: Commit and push if changed
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "没有变化，跳过提交" || git commit -m "Update Millionaire for Life data $(date -u +%Y-%m-%d)"
          git push
      - name: Purge jsDelivr cache
        run: |
          REPO="${{ github.repository }}"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/data/multistate/millionaire-for-life/latest.json"
