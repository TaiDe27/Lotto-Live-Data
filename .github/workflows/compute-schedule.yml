name: Compute daily draw schedule

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute today's schedule
        run: python3 scripts/compute_schedule.py
      - name: Commit schedule file
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/schedule/today.json
          git diff --cached --quiet && echo "没有变化" || git commit -m "Compute schedule for $(date -u +%Y-%m-%d)"
          git push
