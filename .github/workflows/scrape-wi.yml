name: Scrape Wisconsin own-games

on:
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: "internal - set automatically by the auto-retry step below, don't set by hand"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Wisconsin own-games scraper
        id: scrape
        continue-on-error: true
        run: python3 scripts/wi_scraper.py
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "Update Wisconsin own-games data $(date -u +%Y-%m-%d)"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::git push failed after $max_retries retries (push race with another workflow)"
              exit 1
            fi
            wait_seconds=$(( (RANDOM % 241) + 60 ))
            echo "git push rejected (likely a race with another workflow) - retry ${attempt}/${max_retries} in ${wait_seconds}s"
            sleep "$wait_seconds"
            git pull --rebase origin main
          done
      - name: Purge jsDelivr cache
        if: always()
        run: |
          REPO="${{ github.repository }}"
          for p in pick3-midday pick3-evening pick4-midday pick4-evening badger-5 super-cash megabucks; do
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/data/wisconsin/${p}/latest.json"
          done
      - name: Auto-retry once on a fresh runner if the scraper failed
        # Same cause/fix as PA's scrape-pa.yml (both hit www.lottery.net): lottery.net's own
        # WAF/Cloudflare occasionally blocks the specific ephemeral IP a GH Actions runner happens
        # to get, which shows up as every single request of the run timing out at the TCP connect
        # stage. Retrying in-place would just hit the same bad IP again - only a brand new job (a
        # brand new runner = a brand new IP) actually has a chance of recovering. Capped at exactly
        # one automatic retry via `retry_attempt` to avoid a failure storm. Waits before dispatching
        # rather than retrying immediately, same reasoning and interval as PA's version.
        if: steps.scrape.outcome == 'failure' && github.event.inputs.retry_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 180
          gh workflow run scrape-wi.yml -f retry_attempt=1
      - name: Fail job if scraper reported errors
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::scraper reported 1+ game failures this run (see 'Run Wisconsin own-games scraper' step log) - any games that DID succeed were still committed above"
          exit 1
